services:
  civicpatch_web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: civicpatch_web
    working_dir: /rails
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/rails
    ports:
      - "3000:3000"
      - "3036:3036"
    depends_on:
      - civicpatch_db
    environment:
      POSTGRES_HOST: civicpatch_db
      POSTGRES_USER: civicpatch
      POSTGRES_PASSWORD: development-password
      POSTGRES_DB: civicpatch_development
    restart: on-failure

  civicpatch_tailwind:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: civicpatch_tailwind
    working_dir: /rails
    command: bin/rails tailwindcss:watch
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/rails
    depends_on:
      - civicpatch_web
    tty: true

  civicpatch_db:
    image: postgis/postgis:17-3.5
    container_name: civicpatch_db
    restart: always
    environment:
      POSTGRES_USER: civicpatch
      POSTGRES_PASSWORD: development-password
      POSTGRES_DB: civicpatch_development
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  civicpatch_test_db:
    image: postgis/postgis:17-3.5
    container_name: civicpatch_test_db
    restart: always
    environment:
      POSTGRES_USER: civicpatch
      POSTGRES_PASSWORD: test-password
      POSTGRES_DB: civicpatch_test
    volumes:
      - testdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"

volumes:
  pgdata:
  testdata:
